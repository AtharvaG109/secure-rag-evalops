name: Bug report
description: Report a reproducible SecureRAG EvalOps defect.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, endpoint, namespace, and safe fixture details.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Note any authorization, citation, guardrail, or redaction impact.
    validations:
      required: true
