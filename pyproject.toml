[tool.poetry]
name = "securerag-evalops"
version = "0.1.0"
description = "SecureRAG EvalOps portfolio backend"
authors = ["Ethan <ethan@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "*"
uvicorn = { extras = ["standard"], version = "*" }
pydantic = ">=2.0"
pydantic-settings = "*"
qdrant-client = ">=1.7"
sqlalchemy = ">=2.0"
asyncpg = "*"
alembic = "*"
redis = { extras = ["asyncio"], version = "*" }
python-dotenv = "*"
structlog = "*"
pymupdf = "*"
tiktoken = "*"
tenacity = "*"
typer = { extras = ["all"], version = "*" }
rich = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
httpx = "*"
ruff = "*"
mypy = "*"
types-redis = "*"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
